<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA REYNOSA PRO 2025</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

    <section id="sec-home" class="screen active">
        <div class="header-blue">
            <h1>Página Principal</h1>
            <div class="main-layout">
                <div class="nav-stack">
                    <button onclick="nav('sec-reg')">Registrar</button>
                    <button onclick="nav('sec-upd')">Actualizar</button>
                    <button onclick="nav('sec-del')">Eliminar</button>
                    <button onclick="nav('sec-usr')">Administrar Usuarios</button>
                    <button onclick="nav('sec-bar')">Imprimir Código de Barras</button>
                </div>
                <div class="search-zone">
                    <select id="hp-filter"><option>Modelo</option><option>P/N</option></select>
                    <input type="text" id="hp-search" placeholder="Buscar...">
                    <button class="btn-gray">Buscar</button>
                </div>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Modelo</th><th>Nombre</th><th>P/N</th><th>Descripción</th>
                        <th>Costo</th><th>Cantidad</th><th>Ubicación</th><th>Imagen</th>
                    </tr>
                </thead>
                <tbody id="tbody-home"></tbody>
            </table>
        </div>
        <button class="btn-exit" onclick="location.reload()">Salir</button>
    </section>

    <section id="sec-upd" class="screen screen-form">
        <h2 id="form-title">Actualizar / Registro de Objeto</h2>
        <div class="grid-4">
            <div class="field-group">
                <label>Modelo</label><div class="input-cb"><input type="text" id="f-modelo"><input type="checkbox" checked></div>
                <label>No. de Parte</label><div class="input-cb"><input type="text" id="f-parte"><input type="checkbox" checked></div>
                <label>Nombre</label><div class="input-cb"><input type="text" id="f-nombre"><input type="checkbox" checked></div>
                <label>Descripción</label><div class="input-cb"><textarea id="f-desc"></textarea><input type="checkbox" checked></div>
            </div>
            <div class="field-group">
                <label>Cantidad</label><div class="input-cb"><input type="number" id="f-cant"><input type="checkbox" checked></div>
                <label>Costo</label><div class="input-cb"><input type="number" id="f-costo"><input type="checkbox" checked></div>
                <label>Consumible</label><div class="input-cb"><select id="f-cons"><option>Consumible</option><option>No Consumible</option></select><input type="checkbox" checked></div>
                <div class="type-box">
                    <span>Tipo</span>
                    <label><input type="checkbox" id="t-her"> Herramienta</label>
                    <label><input type="checkbox" id="t-equ"> Equipo</label>
                </div>
            </div>
            <div class="field-group">
                <label>Ubicación Área</label><div class="input-cb"><input type="text" id="f-area"><input type="checkbox" checked></div>
                <label>Estante</label><div class="input-cb"><input type="text" id="f-estante"><input type="checkbox" checked></div>
                <label>Lote</label><div class="input-cb"><input type="text" id="f-lote"><input type="checkbox" checked></div>
            </div>
            <div class="field-group">
                <label>Observaciones</label><div class="input-cb"><textarea id="f-obs"></textarea><input type="checkbox" checked></div>
                <button class="btn-gray" onclick="document.getElementById('f-file').click()">Adjuntar Foto</button>
                <input type="file" id="f-file" style="display:none">
                <img id="f-preview" style="width:100px; display:none;">
            </div>
        </div>
        <div class="form-footer">
            <input type="text" id="f-search" placeholder="Modelo para buscar">
            <button class="btn-gray" onclick="buscarYAutoRellenar()">Buscar</button>
            <button class="btn-gray" id="btnPrincipal">Guardar</button>
            <button class="btn-gray" onclick="limpiarForm()">Limpiar</button>
            <button class="btn-gray" onclick="nav('sec-home')">Ir a Página Principal</button>
        </div>
    </section>

    <section id="sec-del" class="screen screen-form">
        <h2>Eliminación objeto</h2>
        <div class="del-box">
            <input type="text" id="del-search" placeholder="Modelo a eliminar">
            <button class="btn-gray" onclick="buscarParaBorrar()">Buscar</button>
            <div id="del-info" class="info-display"></div>
            <button class="btn-gray red-text" onclick="confirmarBorrado()">Eliminar</button>
            <button class="btn-gray" onclick="nav('sec-home')">Ir a Página Principal</button>
        </div>
    </section>

    <section id="sec-bar" class="screen bar-bg">
        <h2>Codigodebarras</h2>
        <div class="bar-container">
            <div class="bar-list" id="bar-list-items"></div>
            <div class="bar-preview"><svg id="barcode-svg"></svg></div>
        </div>
        <div class="bar-controls">
            <input type="text" id="bar-input" placeholder="Modelo">
            <button class="btn-gray" onclick="generarPrevisualizacion()">Agregar</button>
            <button class="btn-gray" onclick="imprimirPDF()">PDF</button>
            <button class="btn-gray" onclick="nav('sec-home')">Salida</button>
        </div>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
